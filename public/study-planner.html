<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Study Planner</title><style>body{margin:0;background:#f6f7fb;color:#151b2b;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#eef0ff;color:#4038a8}.primary{background:#5b5bd6;color:#fff}.muted{color:#758096;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item b{display:block}.pill{display:inline-block;background:#f1f2ff;color:#4038a8;border-radius:999px;padding:4px 8px;font-size:10px;margin:3px 4px 0 0}pre{white-space:pre-wrap;overflow:auto;background:#f8fafc;border-radius:12px;padding:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.btn{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Daily Study Planner</h1><div class="muted">Study plan, chapters and sessions from Firebase</div></div><button class="btn" onclick="location.href='/'">← Main</button></div><div id="status" class="card">Loading your study plan…</div><div class="grid"><div class="card"><h2>Upcoming sessions</h2><div id="sessions"></div></div><div class="card"><h2>Subjects & chapters</h2><div id="subjects"></div></div></div><div class="card"><h2>Data</h2><div class="muted">This compatibility page reads the existing planner data stored under <b>users/{uid}/studyPlanner/study_plan</b> when available.</div><pre id="raw"></pre></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getDatabase,ref,get}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const c={apiKey:'AIzaSyAipiHiXzu4mSvK6BbNjImOHYdkqxKSt3c',authDomain:'tracking-98a71.firebaseapp.com',databaseURL:'https://tracking-98a71-default-rtdb.firebaseio.com',projectId:'tracking-98a71',storageBucket:'tracking-98a71.firebasestorage.app',messagingSenderId:'841004547092',appId:'1:841004547092:web:129ea46b2297ce01c0fb01'},app=initializeApp(c),auth=getAuth(app),db=getDatabase(app),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(u){const s=await get(ref(db,`users/${u.uid}/studyPlanner/study_plan`));if(!s.exists()){$('status').innerHTML='<b>No study planner data found.</b><div class="muted" style="margin-top:6px">Your original study planner file is still available in the source repository; this route is restored so Vercel no longer returns 404.</div>';return}const d=s.val();$('status').innerHTML='<b>Study planner connected to Firebase.</b>';const subs=d.subjects||[];let ss=[],subjects='';for(const sub of subs){subjects+=`<div class="item"><b>${esc(sub.name||sub.subject||'Subject')}</b>`;for(const ch of sub.chapters||[]){subjects+=`<span class="pill">${esc(ch.name||'Chapter')} · ${Number(ch.progress_percent||0)}%</span>`;for(const x of ch.sessions||[]){ss.push({...x,chapter:ch.name,subject:sub.name||sub.subject})}}subjects+='</div>'}ss.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));$('subjects').innerHTML=subjects||'<div class="muted">No subjects found.</div>';$('sessions').innerHTML=ss.slice(0,50).map(x=>`<div class="item"><b>${esc(x.date||'No date')} — ${esc(x.topic||x.chapter||'Study session')}</b><div class="muted">${esc(x.subject||'')} · ${x.planned_minutes||0} min · ${esc(x.status||'Pending')}</div><div class="muted">${esc(x.task_details||'')}</div></div>`).join('')||'<div class="muted">No sessions found.</div>';$('raw').textContent=JSON.stringify(d,null,2)}onAuthStateChanged(auth,async u=>{if(u){try{await load(u)}catch(e){$('status').textContent=e.message}}else{$('status').innerHTML='<b>Sign in to open the Study Planner.</b> <button class="btn primary" id="login">Continue with Google</button>';document.getElementById('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider())}});</script></body></html>
