<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Tracker — Monthly Report</title><style>body{margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#171a21}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:16px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid #ddd;border-radius:10px;padding:10px}.stat span{font-size:11px;color:#777}.stat b{display:block;font-size:20px}.primary,.secondary{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:#5b5bd6;color:#fff}.secondary{background:#eee}table{border-collapse:collapse;width:100%;min-width:680px}th,td{border:1px solid #ddd;padding:7px;font-size:11px;text-align:center}th:first-child,td:first-child{text-align:left;background:#fff}.wraptable{overflow:auto}.fill{height:9px;background:#5b5bd6;border-radius:20px}.bar{height:9px;background:#eee;border-radius:20px}@media(max-width:650px){.wrap{padding:10px}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.top button{padding:8px 9px;font-size:12px}}@media print{.noprint{display:none!important}.card{break-inside:avoid}}</style></head><body><div class="wrap"><div class="top"><div><h1>Daily Tracker</h1><div id="title">Monthly Report</div></div><div class="noprint"><button id="back" class="secondary">← Main</button> <button id="print" class="primary">Print / Save PDF</button></div></div><div id="error" class="card" style="display:none"></div><div id="out"></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{getDatabase,ref,get}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';const c={apiKey:'AIzaSyAipiHiXzu4mSvK6BbNjImOHYdkqxKSt3c',authDomain:'tracking-98a71.firebaseapp.com',databaseURL:'https://tracking-98a71-default-rtdb.firebaseio.com/',projectId:'tracking-98a71',storageBucket:'tracking-98a71.firebasestorage.app',messagingSenderId:'841004547092',appId:'1:841004547092:web:129ea46b2297ce01c0fb01'};const app=initializeApp(c),auth=getAuth(app),db=getDatabase(app);let user,data={tasks:{},habits:{},dailyRecords:{}};const $=x=>document.getElementById(x);function key(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){try{const s=await get(ref(db,'users/'+user.uid));if(s.exists())data=s.val();data.tasks=data.tasks||{};data.habits=data.habits||{};data.dailyRecords=data.dailyRecords||{};build()}catch(e){$('error').style.display='block';$('error').textContent=e.message}}function build(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate(),hs=Object.entries(data.habits).filter(x=>x[1].active!==false);$('title').textContent=n.toLocaleString(undefined,{month:'long',year:'numeric'});let tt=0,ct=0,th=0,ch=0,daily='<tr><th>Date</th><th>Tasks</th><th>Habits</th><th>Overall</th></tr>';for(let d=1;d<=days;d++){const k=key(new Date(y,m,d)),ts=Object.values(data.tasks).filter(t=>t.date===k),tc=ts.filter(t=>t.completed).length,hc=hs.filter(x=>data.dailyRecords?.[k]?.habitChecks?.[x[0]]).length;tt+=ts.length;ct+=tc;th+=hs.length;ch+=hc;const total=ts.length+hs.length,p=total?Math.round((tc+hc)/total*100):0;daily+=`<tr><td>${k}</td><td>${tc}/${ts.length}</td><td>${hc}/${hs.length}</td><td>${p}%</td></tr>`}let ht='<tr><th>Habit</th>';for(let d=1;d<=days;d++)ht+=`<th>${d}</th>`;ht+='</tr>';hs.forEach(([id,h])=>{ht+=`<tr><td>${esc(h.name)}</td>`;for(let d=1;d<=days;d++){const k=key(new Date(y,m,d)),ok=data.dailyRecords?.[k]?.habitChecks?.[id];ht+=`<td>${ok?'✓':''}</td>`}ht+='</tr>'});let notes='';for(let d=1;d<=days;d++){const k=key(new Date(y,m,d)),v=data.dailyRecords?.[k]?.notes;if(v)notes+=`<p><b>${k}</b><br>${esc(v)}</p>`}const overall=tt+th?Math.round((ct+ch)/(tt+th)*100):0;$('out').innerHTML=`<div class="card"><h2>Monthly Summary</h2><div class="stats"><div class="stat"><span>Total Tasks</span><b>${tt}</b></div><div class="stat"><span>Completed Tasks</span><b>${ct}</b></div><div class="stat"><span>Habit Checks</span><b>${ch}/${th}</b></div><div class="stat"><span>Overall</span><b>${overall}%</b></div></div><p>Overall completion: <b>${overall}%</b></p><div class="bar"><div class="fill" style="width:${overall}%"></div></div></div><div class="card"><h2>Daily Progress</h2><div class="wraptable"><table>${daily}</table></div></div><div class="card"><h2>Habit Tracker</h2><div class="wraptable"><table>${ht}</table></div></div><div class="card"><h2>Daily Notes</h2>${notes||'<p>No notes.</p>'}</div>`}$('print').onclick=()=>window.print();$('back').onclick=()=>location.href='/';onAuthStateChanged(auth,u=>{user=u;if(u)load();else location.href='/'});</script></body></html>
